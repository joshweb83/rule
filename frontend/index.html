<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>규정관리시스템</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <i class="fas fa-university"></i>
        <span class="logo-text">대학교</span>
        <span class="logo-divider">|</span>
        <span class="system-name">규정관리시스템</span>
      </div>
    </div>
    <div class="header-right">
      <a href="#" class="header-link">HOME</a>
      <a href="#" class="header-link">관리자</a>
      <a href="#" class="header-link">대학홈</a>
    </div>
  </header>

  <!-- 검색 영역 -->
  <div class="search-container">
    <div class="search-box">
      <select id="searchType" class="search-select">
        <option value="all">전체</option>
        <option value="title">제목</option>
        <option value="content">내용</option>
      </select>
      <input type="text" id="searchKeyword" class="search-input" placeholder="검색어를 입력하세요">
      <button class="btn btn-search" onclick="doSearch()">
        <i class="fas fa-search"></i> 검색
      </button>
    </div>
    <div class="search-buttons">
      <button class="btn btn-outline" onclick="showKoreanIndex()">
        <i class="fas fa-font"></i> 가나다검색
      </button>
      <button class="btn btn-outline" onclick="showDateSearch()">
        <i class="fas fa-calendar"></i> 개정일검색
      </button>
    </div>
  </div>

  <!-- 메인 컨테이너 -->
  <div class="main-container">
    <!-- 좌측 사이드바 -->
    <aside class="sidebar">
      <!-- 메뉴 아이콘 -->
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-category="규정" onclick="changeCategory('규정')">
          <i class="fas fa-book"></i>
          <span>규정</span>
        </a>
        <a href="#" class="nav-item" data-category="지침" onclick="changeCategory('지침')">
          <i class="fas fa-file-alt"></i>
          <span>지침</span>
        </a>
        <a href="#" class="nav-item" data-category="최신" onclick="showLatestRevisions()">
          <i class="fas fa-clock"></i>
          <span>최신<br>제/개정</span>
        </a>
        <a href="#" class="nav-item" data-category="서식" onclick="changeCategory('서식')">
          <i class="fas fa-file-invoice"></i>
          <span>서식</span>
        </a>
        <a href="#" class="nav-item" data-category="사전공고" onclick="showPreNotice()">
          <i class="fas fa-bullhorn"></i>
          <span>사전공고</span>
        </a>
      </nav>

      <!-- 부서 트리 -->
      <div class="dept-tree-container">
        <div class="dept-tree-header">
          <span id="currentCategoryTitle">규정정보</span>
          <div class="tree-controls">
            <button class="btn-icon" onclick="expandAllTree()" title="전체 펼치기">
              <i class="fas fa-plus-square"></i>
            </button>
            <button class="btn-icon" onclick="collapseAllTree()" title="전체 접기">
              <i class="fas fa-minus-square"></i>
            </button>
          </div>
        </div>
        <div class="dept-tree-search">
          <input type="text" id="treeSearch" placeholder="분야별 검색" onkeyup="filterTree()">
        </div>
        <div id="deptTree" class="dept-tree">
          <!-- 트리가 여기에 렌더링됨 -->
        </div>
      </div>
    </aside>

    <!-- 메인 컨텐츠 -->
    <main class="content">
      <!-- 브레드크럼 -->
      <div class="breadcrumb" id="breadcrumb">
        <a href="#">HOME</a>
        <i class="fas fa-chevron-right"></i>
        <span>규정정보</span>
      </div>

      <!-- 컨텐츠 영역 (목록 또는 상세) -->
      <div id="contentArea">
        <!-- 초기: 규정 목록 -->
        <div id="lawListView" class="view-container">
          <h2 class="content-title">규정 목록</h2>
          <div class="list-header">
            <span class="result-count">총 <strong id="totalCount">0</strong>건</span>
            <div class="sort-options">
              <select id="sortOption" onchange="sortLawList()">
                <option value="latest">최신순</option>
                <option value="title">제목순</option>
              </select>
            </div>
          </div>
          <ul id="lawList" class="law-list">
            <!-- 규정 목록이 여기에 렌더링됨 -->
          </ul>
        </div>

        <!-- 규정 상세 -->
        <div id="lawDetailView" class="view-container" style="display: none;">
          <!-- 상세 헤더 -->
          <div class="detail-header">
            <h2 id="lawTitle" class="detail-title">규정 제목</h2>
            <div class="detail-meta">
              <span class="meta-item">
                <i class="fas fa-building"></i>
                담당부서: <strong id="lawDeptName">-</strong>
              </span>
            </div>
          </div>

          <!-- 버전 선택 및 액션 버튼 -->
          <div class="detail-toolbar">
            <div class="version-selector">
              <select id="versionSelect" onchange="changeVersion()">
                <!-- 버전 옵션이 여기에 렌더링됨 -->
              </select>
              <button class="btn-icon" onclick="searchInLaw()" title="규정 내용 검색">
                <i class="fas fa-search"></i>
              </button>
              <button class="btn-icon" onclick="prevArticle()" title="이전 조문">
                <i class="fas fa-chevron-left"></i>
              </button>
              <button class="btn-icon" onclick="nextArticle()" title="다음 조문">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>
            <div class="action-buttons">
              <button class="btn btn-action" onclick="downloadFullText()">
                <i class="fas fa-download"></i> 전문다운
              </button>
              <button class="btn btn-action" onclick="showRevisionHistory()">
                <i class="fas fa-history"></i> 개정정보
              </button>
              <button class="btn btn-action" onclick="toggleViewMode('split')">
                <i class="fas fa-columns"></i> 2단보기
              </button>
              <button class="btn btn-action" onclick="toggleViewMode('full')">
                <i class="fas fa-expand"></i> 전체보기
              </button>
              <button class="btn btn-action" onclick="printLaw()">
                <i class="fas fa-print"></i> 인쇄
              </button>
            </div>
          </div>

          <!-- 개정내역 표시 -->
          <div id="revisionBadge" class="revision-badge" style="display: none;">
            <i class="fas fa-info-circle"></i>
            개정내역 (<span id="revisionCount">0</span>)
          </div>

          <!-- 2단 레이아웃: 목차 + 본문 -->
          <div class="detail-content" id="detailContent">
            <!-- 좌측: 목차 (조문 트리) -->
            <div class="toc-panel" id="tocPanel">
              <div id="articleTree" class="article-tree">
                <!-- 조문 목차가 여기에 렌더링됨 -->
              </div>

              <!-- 부칙 및 별표 -->
              <div class="toc-footer">
                <div class="toc-section">
                  <label>
                    <input type="checkbox" id="showSupplementary" onchange="toggleSupplementary()">
                    내용보기
                  </label>
                </div>
                <div class="toc-section">
                  <strong>별표서식</strong>
                  <div id="attachmentList" class="attachment-list">
                    <!-- 첨부파일 목록 -->
                  </div>
                </div>
              </div>
            </div>

            <!-- 우측: 본문 내용 -->
            <div class="article-panel" id="articlePanel">
              <div id="articleContent" class="article-content">
                <!-- 조문 내용이 여기에 렌더링됨 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 검색 결과 -->
        <div id="searchResultView" class="view-container" style="display: none;">
          <h2 class="content-title">검색 결과</h2>
          <div class="search-result-info">
            "<span id="searchKeywordDisplay"></span>" 검색 결과: <strong id="searchResultCount">0</strong>건
          </div>
          <ul id="searchResultList" class="law-list">
            <!-- 검색 결과가 여기에 렌더링됨 -->
          </ul>
        </div>

        <!-- 최신 제/개정 -->
        <div id="latestRevisionView" class="view-container" style="display: none;">
          <h2 class="content-title">최신 제/개정</h2>
          <ul id="latestRevisionList" class="law-list">
            <!-- 최신 제/개정 목록 -->
          </ul>
        </div>
      </div>
    </main>
  </div>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-content">
      <p>본교 : (우00000) 경기도 OO시 OO로 00 / Tel : 000-000-0000 / Fax : 000-000-0000</p>
      <p>COPYRIGHT © 2024 University. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- 모달 (개정 이력, 검색 등) -->
  <div id="modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">모달 제목</h3>
        <button class="modal-close" onclick="closeModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modalBody" class="modal-body">
        <!-- 모달 내용 -->
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
